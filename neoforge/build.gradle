plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}


neoForge {
    version = neoforge_version
    // Automatically enable neoforge AccessTransformers if the file exists
    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})" // Unify the run config names with fabric
        }
        client {
            client()
        }
        data {
            data()
        }
        server {
            server()
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
            sourceSet project(':api').sourceSets.main
        }
    }
}


dependencies {
    jarJar(implementation("com.bladecoder.ink:blade-ink")) {
        version {
            prefer "${blade_ink_version}"
        }
    }
    jarJar(implementation("com.bladecoder.ink:blade-ink-compiler")) {
        version {
            prefer "${blade_ink_version}"
        }
    }
    additionalRuntimeClasspath "com.bladecoder.ink:blade-ink:${blade_ink_version}"
    additionalRuntimeClasspath "com.bladecoder.ink:blade-ink-compiler:${blade_ink_version}"
    implementation project(':api')
}


sourceSets.main.resources { srcDir 'src/generated/resources' }

jar {
    from project(':api').sourceSets.main.output
}
