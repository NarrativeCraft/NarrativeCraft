plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev'
    id 'maven-publish'
}

base {
    archivesName = 'narrativecraft-api'
}

neoForge {
    neoFormVersion = neo_form_version
}

dependencies {
    compileOnly group: 'org.spongepowered', name: 'mixin', version: '0.8.5'
    // fabric and neoforge both bundle mixinextras, so it is safe to use it in common
    compileOnly group: 'io.github.llamalad7', name: 'mixinextras-common', version: '0.3.5'
    annotationProcessor group: 'io.github.llamalad7', name: 'mixinextras-common', version: '0.3.5'
    implementation "com.bladecoder.ink:blade-ink:1.3.2"
}

configurations {
    apiJava {
        canBeResolved = false
        canBeConsumed = true
    }
    apiResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    apiJava sourceSets.main.java.sourceDirectories.singleFile
    apiResources sourceSets.main.resources.sourceDirectories.singleFile
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId base.archivesName.get()
            version "${version}+mc${minecraft_version}"
            from components.java
        }
    }
    repositories {
        maven {
            name = 'Reposilite'
            url = 'https://maven.loudo.dev'
            credentials {
                username = findProperty('reposiliteUser') ?: ''
                password = findProperty('reposilitePassword') ?: ''
            }
            authentication {
                basic(BasicAuthentication)
            }
        }
    }
}

