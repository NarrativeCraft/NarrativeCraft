plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev'
    id 'multiloader-library'
}

base {
    archivesName = 'narrativecraft-api'
}

neoForge {
    neoFormVersion = neo_form_version
}

dependencies {
    implementation "com.bladecoder.ink:blade-ink:${blade_ink_version}"
}

configurations {
    apiJava {
        canBeResolved = false
        canBeConsumed = true
    }
    apiResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    apiJava sourceSets.main.java.sourceDirectories.singleFile
    apiResources sourceSets.main.resources.sourceDirectories.singleFile
}

