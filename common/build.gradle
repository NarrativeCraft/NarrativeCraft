plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev'
    id 'maven-publish'
}

base {
    archivesName = 'narrativecraft-common'
}

neoForge {
    neoFormVersion = neo_form_version
    // Automatically enable AccessTransformers if the file exists
    def at = file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
}

dependencies {
    compileOnly group: 'org.spongepowered', name: 'mixin', version: '0.8.5'
    // fabric and neoforge both bundle mixinextras, so it is safe to use it in common
    compileOnly group: 'io.github.llamalad7', name: 'mixinextras-common', version: '0.3.5'
    annotationProcessor group: 'io.github.llamalad7', name: 'mixinextras-common', version: '0.3.5'

    implementation "com.bladecoder.ink:blade-ink:1.3.2"
    implementation "com.bladecoder.ink:blade-ink-compiler:1.3.2"
    implementation project(':api')
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}

// Set loader attribute only on classpath configurations (not on published variants)
// Publishing loader=common on apiElements/runtimeElements would break external consumers
// (e.g. Fabric mods) whose Gradle configurations request loader=fabric
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant->
        configurations.named("$variant") {
            attributes {
                attribute(loaderAttribute, 'common')
            }
        }
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId base.archivesName.get()
            from components.java
        }
    }
    repositories {
        maven {
            name = 'Reposilite'
            url = 'https://maven.loudo.dev'
            credentials {
                username = findProperty('reposiliteUser') ?: ''
                password = findProperty('reposilitePassword') ?: ''
            }
            authentication {
                basic(BasicAuthentication)
            }
        }
    }
}
