plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev'
    id 'multiloader-library'
}

base {
    archivesName = 'narrativecraft-common'
}

neoForge {
    neoFormVersion = neo_form_version
    // Automatically enable AccessTransformers if the file exists
    def at = file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
}

dependencies {
    implementation "com.bladecoder.ink:blade-ink:${blade_ink_version}"
    implementation "com.bladecoder.ink:blade-ink-compiler:${blade_ink_version}"
    implementation project(':api')
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}

// Set loader attribute only on classpath configurations (not on published variants)
// Publishing loader=common on apiElements/runtimeElements would break external consumers
// (e.g. Fabric mods) whose Gradle configurations request loader=fabric
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant->
        configurations.named("$variant") {
            attributes {
                attribute(loaderAttribute, 'common')
            }
        }
    }
}
