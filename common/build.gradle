plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev.legacyforge'
    id 'multiloader-library'
}

base {
    archivesName = 'narrativecraft-common'
}

legacyForge {
    mcpVersion = minecraft_version
    // Automatically enable AccessTransformers if the file exists
    if (file('src/main/resources/META-INF/accesstransformer.cfg').exists()) {
        accessTransformers = ['src/main/resources/META-INF/accesstransformer.cfg']
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
}

dependencies {
    implementation "com.bladecoder.ink:blade-ink:${blade_ink_version}"
    implementation "com.bladecoder.ink:blade-ink-compiler:${blade_ink_version}"
    implementation "org.yaml:snakeyaml:${snakeyaml_version}"
    implementation project(':api')
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}

// Set loader attribute only on classpath configurations (not on published variants)
// Publishing loader=common on apiElements/runtimeElements would break external consumers
// (e.g. Fabric mods) whose Gradle configurations request loader=fabric
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant->
        configurations.named("$variant") {
            attributes {
                attribute(loaderAttribute, 'common')
            }
        }
    }
}
