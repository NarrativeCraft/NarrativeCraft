name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4.4.4

      - name: Extract variables
        id: vars
        run: |
          MOD_VERSION="${GITHUB_REF_NAME#v}"
          MINECRAFT_VERSION=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2)

          echo "MOD_VERSION=${MOD_VERSION}" >> $GITHUB_ENV
          echo "MINECRAFT_VERSION=${MINECRAFT_VERSION}" >> $GITHUB_ENV

          # Extract the changelog section for this version from CHANGELOG.md
          CHANGELOG=$(awk "/^## \[${MOD_VERSION}\]/{flag=1; next} /^## \[/{flag=0} flag" CHANGELOG.md)
          echo "CHANGELOG<<EOF" >> $GITHUB_ENV
          echo "$CHANGELOG" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Build jars
        run: ./gradlew :fabric:build :neoforge:build

      - name: Publish API and Common to Maven
        run: ./gradlew :api:publish :common:publish
        env:
          ORG_GRADLE_PROJECT_reposiliteUser: ${{ secrets.REPOSILITE_USER }}
          ORG_GRADLE_PROJECT_reposilitePassword: ${{ secrets.REPOSILITE_PASSWORD }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ env.CHANGELOG }}
          files: |
            fabric/build/libs/narrativecraft-fabric-${{ env.MINECRAFT_VERSION }}-${{ env.MOD_VERSION }}.jar
            neoforge/build/libs/narrativecraft-neoforge-${{ env.MINECRAFT_VERSION }}-${{ env.MOD_VERSION }}.jar

      - name: Publish Fabric jar to Modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          DATA=$(jq -n \
            --arg name "NarrativeCraft - Fabric - ${MOD_VERSION} - ${MINECRAFT_VERSION}" \
            --arg version "${MOD_VERSION}-fabric-${MINECRAFT_VERSION}" \
            --arg changelog "${CHANGELOG}" \
            --arg mc_version "${MINECRAFT_VERSION}" \
            '{
              name: $name,
              version_number: $version,
              changelog: $changelog,
              dependencies: [{project_id: "P7dR8mSH", dependency_type: "required"}],
              game_versions: [$mc_version],
              version_type: "release",
              environment: "client_and_server",
              loaders: ["fabric"],
              featured: true,
              project_id: "bR35WQGQ",
              file_parts: ["file"]
            }')
          curl -sf -X POST "https://api.modrinth.com/v2/version" \
            -H "Authorization: ${MODRINTH_TOKEN}" \
            -F "data=${DATA}" \
            -F "file=@fabric/build/libs/narrativecraft-fabric-${MINECRAFT_VERSION}-${MOD_VERSION}.jar"

      - name: Publish NeoForge jar to Modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          DATA=$(jq -n \
            --arg name "NarrativeCraft - NeoForge - ${MOD_VERSION} - ${MINECRAFT_VERSION}" \
            --arg version "${MOD_VERSION}-neoforge-${MINECRAFT_VERSION}" \
            --arg changelog "${CHANGELOG}" \
            --arg mc_version "${MINECRAFT_VERSION}" \
            '{
              name: $name,
              version_number: $version,
              changelog: $changelog,
              dependencies: [],
              game_versions: [$mc_version],
              version_type: "release",
              environment: "client_and_server",
              loaders: ["neoforge"],
              featured: true,
              project_id: "bR35WQGQ",
              file_parts: ["file"]
            }')
          curl -sf -X POST "https://api.modrinth.com/v2/version" \
            -H "Authorization: ${MODRINTH_TOKEN}" \
            -F "data=${DATA}" \
            -F "file=@neoforge/build/libs/narrativecraft-neoforge-${MINECRAFT_VERSION}-${MOD_VERSION}.jar"
